<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
        <title>Klienci</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="client-view">
        <div class="client-page">
            <header class="client-header">
                <div class="client-brand">
                    <h1>LQMe</h1>
                    <p class="muted">
                        Wybierz smak i moc, aby sprawdzić dostępność.
                    </p>
                </div>
                <nav class="client-menu">
                    <a class="active" href="klienci.html">Klienci</a>
                </nav>
            </header>

            <main class="client-content">
                <section>
                    <div class="section-head">
                        <h2>Dostępne smaki</h2>
                    </div>
                    <div id="clientFlavorList" class="flavor-grid"></div>
                </section>

                <section class="panel">
                    <h2>Koszyk</h2>
                    <p class="muted">
                        Koszyk pokazuje, czy zamówienie dla wybranych smaków i mocy
                        może zostać przygotowane.
                    </p>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Smak</th>
                                    <th>Rodzaj</th>
                                    <th>Moc</th>
                                    <th>Ilość</th>
                                    <th>Akcja</th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody"></tbody>
                        </table>
                    </div>

                    <div id="cartSummary" class="cart-summary"></div>
                </section>
            </main>
        </div>

        <div
            id="clientPopup"
            class="client-popup hidden"
            role="status"
            aria-live="polite"
        ></div>

        <div id="clientNoticeModal" class="modal" aria-hidden="false">
            <div class="modal-backdrop" data-close-client-notice="true"></div>
            <div
                class="modal-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="clientNoticeTitle"
            >
                <div class="modal-header">
                    <h3 id="clientNoticeTitle">Informacja</h3>
                    <button
                        type="button"
                        class="modal-close"
                        id="closeClientNoticeBtn"
                        aria-label="Zamknij"
                    >
                        X
                    </button>
                </div>

                <p class="muted">Strona jest w trakcie budowy.</p>

                <div class="actions-row sale-actions">
                    <button type="button" id="clientNoticeConfirmBtn">Rozumiem</button>
                </div>
            </div>
        </div>

        <script src="data.js"></script>
        <script src="klienci.js"></script>
    </body>
</html>
